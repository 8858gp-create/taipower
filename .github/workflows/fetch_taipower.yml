name: Fetch Taipower loadpara

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch loadpara via Cloudflare Worker
        run: python scripts/fetch_loadpara.py
        env:
          WORKER_URL:   ${{ secrets.WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}   # 可選，Worker 不設 token 就留空

      - name: Check for new files
        id: check
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            NEW_FILE=$(git diff --cached --name-only | grep -E 'data/(json|txt)/[0-9]+' | head -1)
            TIMESTAMP=$(basename "$NEW_FILE" | sed 's/\..*//')
            echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
            echo "新資料：$TIMESTAMP"
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "data: ${{ steps.check.outputs.timestamp }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report failure
        if: failure()
        run: echo "::warning::Worker 中繼失敗，請確認 WORKER_URL secret 是否正確"
